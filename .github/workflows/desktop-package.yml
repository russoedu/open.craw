# Builds the desktop app's installers on each platform and starts the unpacked app once. Unsigned: signing,
# notarisation and the update feed are the rest of issue #96. Nothing is published from here; the installers
# are only kept as run artifacts. Runs when the desktop app (or what it packs) changes, or by hand.
name: desktop-package

on:
  workflow_dispatch:
  pull_request:
    paths:
      - apps/studio-desktop/**
      - apps/studio-ui/**
      - packages/studio/**
      - .github/workflows/desktop-package.yml

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Unsigned for now: do not go looking for a signing identity.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Installer
        run: npm run studio-desktop:package
      - name: The unpacked app starts (Linux, on a virtual display)
        if: runner.os == 'Linux'
        run: |
          npm run studio-desktop:package:dir
          cd apps/studio-desktop
          npx tsc -p tsconfig.e2e.json
          xvfb-run -a npx jest --config jest.e2e.config.cts --forceExit packaged
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        with:
          name: studio-desktop-${{ runner.os }}
          path: |
            apps/studio-desktop/release/*.exe
            apps/studio-desktop/release/*.dmg
            apps/studio-desktop/release/*.AppImage
          if-no-files-found: error
